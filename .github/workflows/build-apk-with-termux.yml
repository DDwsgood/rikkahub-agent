name: Calendar reminder probe

on:
  workflow_dispatch:
    inputs:
      bootstrap_run_id:
        description: Not used by the probe build on this test branch
        required: false
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash tools/calendar-reminder-probe/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: calendar-reminder-probe
          path: tools/calendar-reminder-probe/out/calendar-reminder-probe.apk
          if-no-files-found: error
          retention-days: 7
